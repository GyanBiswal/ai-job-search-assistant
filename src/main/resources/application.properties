spring.application.name=backend

# --- PostgreSQL connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_job_search
spring.datasource.username=job_search_user
spring.datasource.password=devpassword123
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Actuator: expose health endpoint with DB details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# --- Server port ---
server.port=8080

# --- JWT ---
jwt.secret=Cj8vQ2xTZWNyZXRLZXlGb3JBSUpvYlNlYXJjaEFwcGxpY2F0aW9uMjAyNQ==
jwt.expiration-ms=86400000

# --- File upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.file.upload-dir=uploads/resumes

# --- Groq AI (OpenAI-compatible client, pointed at Groq) ---
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.model.embedding=none